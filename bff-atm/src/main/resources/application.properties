spring.application.name=bff-atm

server.port=8084

# ========================================
# OpenFeign
# ========================================
spring.cloud.openfeign.client.config.backend-core.connectTimeout=2000
spring.cloud.openfeign.client.config.backend-core.readTimeout=5000

# ========================================
# Eureka Discovery
# ========================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ========================================
# Resilience4j - Circuit Breaker
# ========================================
resilience4j.circuitbreaker.instances.backendCore.slidingWindowSize=10
resilience4j.circuitbreaker.instances.backendCore.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.backendCore.failureRateThreshold=50
resilience4j.circuitbreaker.instances.backendCore.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.backendCore.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.backendCore.automaticTransitionFromOpenToHalfOpenEnabled=true

# ========================================
# Resilience4j - Retry
# ========================================
resilience4j.retry.instances.backendCore.maxAttempts=3
resilience4j.retry.instances.backendCore.waitDuration=1s
resilience4j.retry.instances.backendCore.enableExponentialBackoff=true
resilience4j.retry.instances.backendCore.exponentialBackoffMultiplier=2

# ========================================
# Actuator
# ========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ========================================
# OAuth2 Resource Server
# ========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_SERVER_URL:http://localhost:9000}